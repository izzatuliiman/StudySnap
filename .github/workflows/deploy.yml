name: Deploy StudySnap to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS Credentials ─────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-5

      # ── 3. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. SAM CLI ────────────────────────────────────────────────────────
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 5. SAM Build ───────────────────────────────────────────────────────
      - name: SAM build
        run: sam build --template infra/template.yaml

      # ── 6. SAM Deploy ──────────────────────────────────────────────────────
      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name study-snap \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ── 7. Read CloudFormation Outputs ─────────────────────────────────────
      - name: Read stack outputs
        id: cfn
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name study-snap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          echo "diagram_url=$(get_output DiagramApiUrl)"               >> "$GITHUB_OUTPUT"
          echo "study_time_url=$(get_output EstimatedStudyTimeUrl)"    >> "$GITHUB_OUTPUT"
          echo "summary_url=$(get_output BulletPointSummaryUrl)"       >> "$GITHUB_OUTPUT"
          echo "glossary_url=$(get_output KeyTermsGlossaryUrl)"        >> "$GITHUB_OUTPUT"
          echo "examples_url=$(get_output RealWorldExamplesUrl)"       >> "$GITHUB_OUTPUT"
          echo "difficulty_url=$(get_output DifficultyLevelTagUrl)"    >> "$GITHUB_OUTPUT"
          echo "flashcards_url=$(get_output FlashcardsUrl)"            >> "$GITHUB_OUTPUT"
          echo "quiz_url=$(get_output InteractiveQuizUrl)"             >> "$GITHUB_OUTPUT"
          echo "bucket_name=$(get_output BucketName)"                  >> "$GITHUB_OUTPUT"
          echo "website_url=$(get_output WebsiteUrl)"                  >> "$GITHUB_OUTPUT"

      # ── 8. Inject URLs into frontend ───────────────────────────────────────
      - name: Inject Lambda URLs into index.html
        run: |
          cp frontend/index.html frontend/index.html.bak

          sed -i "s|__DIAGRAM_API_URL__|${{ steps.cfn.outputs.diagram_url }}|g"      frontend/index.html
          sed -i "s|__URL_ESTIMATED_STUDY_TIME__|${{ steps.cfn.outputs.study_time_url }}|g" frontend/index.html
          sed -i "s|__URL_BULLET_POINT_SUMMARY__|${{ steps.cfn.outputs.summary_url }}|g"    frontend/index.html
          sed -i "s|__URL_KEY_TERMS_GLOSSARY__|${{ steps.cfn.outputs.glossary_url }}|g"     frontend/index.html
          sed -i "s|__URL_REAL_WORLD_EXAMPLES__|${{ steps.cfn.outputs.examples_url }}|g"    frontend/index.html
          sed -i "s|__URL_DIFFICULTY_LEVEL_TAG__|${{ steps.cfn.outputs.difficulty_url }}|g" frontend/index.html
          sed -i "s|__URL_FLASHCARDS__|${{ steps.cfn.outputs.flashcards_url }}|g"           frontend/index.html
          sed -i "s|__URL_INTERACTIVE_QUIZ__|${{ steps.cfn.outputs.quiz_url }}|g"           frontend/index.html

      # ── 9. Upload frontend to S3 ───────────────────────────────────────────
      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/ \
            s3://${{ steps.cfn.outputs.bucket_name }}/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            --delete

      # ── 10. Restore original index.html (keep repo clean) ──────────────────
      - name: Restore original index.html
        run: mv frontend/index.html.bak frontend/index.html

      # ── 11. Print live URL ─────────────────────────────────────────────────
      - name: Print website URL
        run: |
          echo ""
          echo "✅ StudySnap deployed successfully!"
          echo "🌐 Live URL: ${{ steps.cfn.outputs.website_url }}"
          echo ""
